<style>:root{--bg:#f5f6fb;--card:#fff;--ink:#1b1f2a;--muted:#6a7185;--brand:#3b4cca;--brand2:#6a5af9;--ok:#16794c;--okbg:#e5f6ee;--warn:#8a5a00;--warnbg:#fff4d6;--bad:#a1122b;--badbg:#fde8ec;--line:#e3e6f0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:700;display:flex;gap:8px;align-items:center}.brand small{font-weight:400;color:var(--muted)}
.logo{color:var(--brand2);font-size:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-btn{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.lang-btn.active{background:var(--brand);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
.hero{background:linear-gradient(135deg,#fff,#eef0ff);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(59,76,202,.08)}
h1{margin:0 0 6px;font-size:30px}h3{margin:2px 0 8px;font-size:18px}
.muted{color:var(--muted)}.small{font-size:13px}
textarea{width:100%;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--brand2);outline-offset:1px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;padding:10px 22px;border-radius:10px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;cursor:pointer}
.local-note{margin-left:auto;font-size:12px;color:var(--ok)}
#result{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;justify-content:space-between;gap:12px}.conf{text-align:right}.conf strong{font-size:22px;display:block}
.label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;font-size:14px}
button.chip{cursor:pointer;font-weight:600;color:var(--brand)}
.chip-ok{background:var(--okbg);color:var(--ok);border-color:#bfe6d2}
.banner{border-radius:12px;padding:14px 18px;border:1px solid}.banner p{margin:4px 0 0}
.banner-urgent{background:var(--badbg);color:var(--bad);border-color:#f3b4c0}
.banner-time{background:var(--warnbg);color:var(--warn);border-color:#f0d58a}
.q{display:block;margin:10px 0}.q span{display:block;font-size:14px;margin-bottom:4px}
.q input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.badge-demo{display:inline-block;background:#222;color:#ffd84d;font-size:11px;font-weight:800;letter-spacing:.08em;padding:2px 8px;border-radius:6px;vertical-align:middle}
.demo-note{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px}
.offer-list{display:grid;gap:10px;margin-top:10px}
.offer{display:flex;flex-direction:column;gap:2px;border:2px dashed #c9cbd8;border-radius:12px;padding:12px;background:#fafaff}
.offers [data-locked]{margin:0}
</style>
</head>

<main class="wrap">

    <textarea id="request" rows="4" aria-label="request"></textarea>

      <button type="button" id="btn-clear" class="ghost"></button>
      <span class="local-note">⬤ offline · fără rețea / no network</span>
    </div>
  </section>
  <section id="result" aria-live="polite"></section>
</main>

<script>// Client-facing logic for the AI services platform (name TBD). PREP, local only, no network.
// Port of triage/engine.py (rules come from the generated rules.js) + a view-model + HTML renderer.
// Works in the browser (window.PlatformLogic) and in node (require) so it can be tested.

  var rules = (typeof module === 'object' && module.exports) ? require('./rules.js') : root.TriageRules;

  function score(text) {
    var t = text.toLowerCase(), out = {};
    Object.keys(RULES.DOMAINS).forEach(function (d) {
      var n = 0;
      RULES.DOMAINS[d].filter(function (k, i, a) { return a.indexOf(k) === i; }).forEach(function (k) { if (t.indexOf(k) !== -1) n++; });
      out[d] = n;
    });
    return out;
  }
  function factsFor(domain, text) {
    var t = text.toLowerCase(), known = [], missing = [];
    RULES.FACTS[domain].forEach(function (f) {
      if (new RegExp(f[2]).test(t)) known.push(f[0]); else missing.push([f[0], f[1]]);
    });
    return { known: known, missing: missing };
  }
  function triage(request, minKnown) {
    minKnown = minKnown === undefined ? MIN_KNOWN : minKnown;
    if (typeof request !== 'string' || !request.trim()) {
      return { domain: null, confidence: 0, missing: [], known: [], blocked: false, note: 'empty request', ready_for_offers: false };
    }
    var t = request.toLowerCase();
    for (var i = 0; i < RULES.BLOCKLIST.length; i++) {
      if (new RegExp(RULES.BLOCKLIST[i]).test(t)) {
        return { domain: null, confidence: 0, missing: [], known: [], blocked: true, note: 'urgent', ready_for_offers: false };
      }
    }
    var scores = score(request), vals = Object.keys(scores).map(function (k) { return scores[k]; });
    var best = Math.max.apply(null, vals);
    if (best === 0) return { domain: null, confidence: 0, missing: [], known: [], blocked: false, note: 'domain unclear', ready_for_offers: false };
    var tops = Object.keys(scores).filter(function (d) { return scores[d] === best; }).sort();
    var total = vals.reduce(function (a, b) { return a + b; }, 0);
    var conf = Math.round(best / total * 100) / 100;
    if (tops.length !== 1) return { domain: null, confidence: conf, missing: [], known: [], blocked: false, note: 'tie', tied: tops, ready_for_offers: false };

  // Obviously fictional experts. Never real names.
  var DEMO_EXPERTS = {

           + '<p class="muted small">' + esc(S.disclaimer) + '</p>';
    }
    if (view.timeUrgent) h += '<div class="banner banner-time" role="status" data-flag="time-urgent"><strong>' + esc(S.timeTitle) + '</strong><p>' + esc(S.timeBody) + '</p></div>';
    if (view.state === 'unclear' || view.state === 'tie') {
      var t = view.state === 'tie' ? [S.tieTitle, S.tieBody] : [S.unclearTitle, S.unclearBody];
      h += '<div class="card"><h3>' + esc(t[0]) + '</h3><p>' + esc(t[1]) + '</p><div class="chips">';
      view.choices.forEach(function (d) { h += '<button type="button" class="chip" data-domain="' + esc(d) + '">' + esc(S.domains[d]) + '</button>'; });
      return h + '</div></div><p class="muted small">' + esc(S.disclaimer) + '</p>';
    }
    h += '<div class="card"><div class="row"><div><span class="label">' + esc(S.domain) + '</span><h3 data-domain-label>' + esc(view.domainLabel) + '</h3></div>'
       + '<div class="conf"><span class="label">' + esc(S.confidence) + '</span><strong>' + Math.round(view.confidence * 100) + '%</strong></div></div>';
    if (view.known.length) {
      h += '<span class="label">' + esc(S.known) + '</span><div class="chips">';
      view.known.forEach(function (k) { h += '<span class="chip chip-ok">✓ ' + esc(k.label) + '</span>'; });
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="card"><h3>' + esc(S.missing) + '</h3>';
    if (!view.questions.length) h += '<p class="muted">' + esc(S.allAnswered) + '</p>';
    view.questions.forEach(function (q) {
      h += '<label class="q"><span>' + esc(q.text) + '</span><input type="text" data-fact="' + esc(q.key) + '" placeholder="' + esc(S.answerHere) + '" value="' + esc(answers[q.key] || '') + '"></label>';
    });
    h += '</div>';
    h += '<div class="card offers" data-panel="offers"><h3>' + esc(S.offers) + ' <span class="badge-demo">' + esc(S.demoBadge) + '</span></h3>';
    if (view.offers.visible) {
      h += '<p class="demo-note">' + esc(S.demoNote) + '</p><div class="offer-list">';
      view.offers.items.forEach(function (o) {
        h += '<div class="offer" data-demo="true"><span class="badge-demo">' + esc(S.demoBadge) + '</span><strong>' + esc(o.name) + '</strong><span class="muted">' + esc(o.speciality) + '</span>'
           + '<span class="small">' + esc(S.responseTime) + ': ' + esc(o.response) + ' · ' + esc(S.priceRange) + ': ' + esc(o.price) + ' (' + esc(S.demoPrice) + ')</span></div>';
      });
      h += '</div>';
    } else {
      h += '<p class="muted" data-locked>' + esc(view.offers.lockedReason) + '</p>';
    }
    h += '</div><p class="muted small">' + esc(S.disclaimer) + '</p>';
    return h;
  }

  return { triage: triage, factsFor: factsFor, timeUrgent: timeUrgent, buildView: buildView, renderHTML: renderHTML, esc: esc,
           STR: STR, DEMO_EXPERTS: DEMO_EXPERTS, MIN_KNOWN: MIN_KNOWN, DOMAIN_KEYS: DOMAIN_KEYS };
});
</script>
<script>(function () {
  'use strict';
  var L = window.PlatformLogic;
  var state = { lang: 'ro', answers: {}, domain: null };
  var $ = function (id) { return document.getElementById(id); };

  function labels() {
    var S = L.STR[state.lang];
    document.documentElement.lang = state.lang;
    $('t-title').textContent = S.title; $('t-sub').textContent = S.subtitle;
    $('request').placeholder = S.placeholder;
    $('btn-analyze').textContent = S.analyze; $('btn-clear').textContent = S.clear;
    $('lang-ro').classList.toggle('active', state.lang === 'ro'); $('lang-ro').setAttribute('aria-pressed', state.lang === 'ro');
    $('lang-en').classList.toggle('active', state.lang === 'en'); $('lang-en').setAttribute('aria-pressed', state.lang === 'en');
  }
  function render(keepFocus) {
    var focusKey = keepFocus && document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fact');
    var view = L.buildView($('request').value, { lang: state.lang, answers: state.answers, domain: state.domain });
    $('result').innerHTML = L.renderHTML(view, state.answers);
    if (focusKey) { var el = $('result').querySelector('[data-fact="' + focusKey + '"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  }
  $('btn-analyze').addEventListener('click', function () { state.domain = null; render(false); });
  $('btn-clear').addEventListener('click', function () { $('request').value = ''; state.answers = {}; state.domain = null; render(false); $('request').focus(); });
  $('request').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { state.domain = null; render(false); } });
  $('lang-ro').addEventListener('click', function () { state.lang = 'ro'; labels(); render(false); });
  $('lang-en').addEventListener('click', function () { state.lang = 'en'; labels(); render(false); });
  $('result').addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-fact');
    if (k) { state.answers[k] = e.target.value; clearTimeout(state.t); state.t = setTimeout(function () { render(true); }, 450); }
  });
  $('result').addEventListener('click', function (e) {
    var d = e.target.getAttribute && e.target.getAttribute('data-domain');
    if (d) { state.domain = d; render(false); }
  });
  labels(); render(false);
})();
</script>
